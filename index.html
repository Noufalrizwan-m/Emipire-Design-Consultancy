(function(){
  var loader=document.getElementById('site-loader');
  var logo=loader.querySelector('.loader-logo');
  var start=Date.now(), finished=false, ready=false, animation;
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
  document.documentElement.classList.add('logo-intro-active');
  function finish(){
    if(finished)return;
    finished=true;
    document.documentElement.classList.remove('logo-intro-active');
    loader.remove();document.removeEventListener('keydown',skip);
  }
  function skip(event){if(event.key==='Escape')finish()}
  document.addEventListener('keydown',skip);
  window.empireSiteReady=function(){
    if(ready||finished)return;
    ready=true;
    var delay=reduced.matches?0:Math.max(0,1700-(Date.now()-start));
    setTimeout(function(){
      if(finished)return;
      var destination=document.querySelector('.site-header .brand img');
      if(!destination||reduced.matches){finish();return}
      var from=logo.getBoundingClientRect(),to=destination.getBoundingClientRect();
      loader.classList.add('is-moving');
      animation=logo.animate([
        {left:from.left+'px',top:from.top+'px',width:from.width+'px',height:from.height+'px',transform:'none'},
        {left:to.left+'px',top:to.top+'px',width:to.width+'px',height:to.height+'px',transform:'none'}
      ],{duration:1200,easing:'cubic-bezier(.65,0,.2,1)',fill:'forwards'});
      animation.finished.then(finish).catch(finish);
      setTimeout(finish,1400);
    },delay);
  };
  setTimeout(window.empireSiteReady,6000);
})();
