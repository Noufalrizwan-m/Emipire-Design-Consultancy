(function(){
  var loader=document.getElementById('site-loader'), label=loader.querySelector('.loader-progress'), finished=false;
  var timer=setInterval(function(){var value=parseInt(label.textContent,10); if(value<85) label.textContent=Math.min(85,value+5)+'%';},120);
  window.empireSiteReady=function(){
    if(finished)return; finished=true; clearInterval(timer); label.textContent='100%';
    setTimeout(function(){
      var destination=document.querySelector('.site-header .brand img'), logo=loader.querySelector('.loader-logo');
      if(destination && !matchMedia('(prefers-reduced-motion: reduce)').matches){
        var from=logo.getBoundingClientRect(), to=destination.getBoundingClientRect();
        loader.style.setProperty('--logo-x',(to.left+to.width/2-from.left-from.width/2)+'px');
        loader.style.setProperty('--logo-y',(to.top+to.height/2-from.top-from.height/2)+'px');
        loader.style.setProperty('--logo-width',to.width+'px'); loader.style.setProperty('--logo-height',to.height+'px');
        loader.classList.add('is-moving'); setTimeout(function(){loader.classList.add('is-ready');setTimeout(function(){loader.remove()},350)},650);
      }else{loader.classList.add('is-ready');setTimeout(function(){loader.remove()},350)}
    },150);
  };
  setTimeout(window.empireSiteReady,6000);
})();
